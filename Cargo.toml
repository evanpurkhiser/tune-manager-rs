[package]
name = "rusty-tunes"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
ffmpeg-next = "7.0.2"
httpmock = "0.7.0"
id3 = "1.13.1"
lazy_static = "1.5.0"
pretty_assertions = "1.4.0"
regex = "1.10.5"
reqwest = { version = "0.12.5", features = ["json", "cookies"] }
serde = "1.0.203"
serde_json = "1.0.120"
sqlx = { version = "0.7.4", features = ["sqlite", "runtime-tokio", "sqlx-macros"] }
thiserror = "1.0.61"
tokio = { version = "1.38.0", features = ["macros", "rt", "rt-multi-thread"] }
url = "2.5.2"
walkdir = "2.5.0"
