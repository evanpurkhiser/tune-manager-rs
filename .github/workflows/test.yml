name: Tests

on:
  push:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            libswresample-dev libavformat-dev libavutil-dev libavcodec-dev libfftw3-dev ffmpeg

      - name: Build libkeyfinder
        run: |
          git clone https://github.com/mixxxdj/libkeyfinder keyfinder
          cd keyfinder
          cmake -S . -B build
          cmake --build build
          sudo cmake --install build
          sudo ldconfig

      - name: Build keyfinder-cli
        run: |
          git clone https://github.com/evanpurkhiser/keyfinder-cli
          cd keyfinder-cli
          cmake -S . -B build
          cmake --build build
          sudo cmake --install build

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-

      - name: Cache cargo index
        uses: actions/cache@v4
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-git-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-git-

      - name: Cache target directory
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-target-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-target-

      - name: Run tests
        run: cargo test --verbose
