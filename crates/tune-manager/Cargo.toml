[package]
name = "tune-manager"
version = "0.1.0"
rust-version = "1.90"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
async-openai = "0.29.4"
axum = { version = "0.7.5", features = ["tokio", "ws"] }
chrono = { version = "0.4.40", features = ["serde"] }
clap = { version = "4.5.8", features = ["derive"] }
clap_derive = "4.5.8"
console = "0.15.8"
csv = "1.3.1"
figment = { version = "0.10.19", features = ["serde_yaml", "yaml", "test"] }
futures = "0.3.31"
hex = "0.4.3"
httpmock = "0.7.0"
id3 = "1.13.1"
md5 = "0.7.0"
pretty_assertions = "1.4.0"
regex = "1.10.5"
reqwest = { version = "0.12.5", features = ["json", "cookies"] }
sentry = { version = "0.34.0", features = ["tracing"] }
serde = "1.0.203"
serde_json = "1.0.120"
serde_with = "3.12.0"
serde_yaml = "0.9.34"
sqlx = { version = "0.7.4", features = ["sqlite", "runtime-tokio", "sqlx-macros"] }
strum = { version = "0.27.2", features = ["derive"] }
thiserror = "1.0.61"
tokio = { version = "1.38.0", features = ["macros", "rt", "rt-multi-thread"] }
tokio-stream = "0.1.17"
tokio-util = "0.7"
tracing = "0.1.40"
tracing-subscriber = { version = "0.3.18", features = ["tracing", "json"] }
typify = "0.4.3"
url = "2.5.2"
uuid = { version = "1.0", features = ["v4"] }
walkdir = "2.5.0"
